<!DOCTYPE html>
<html>
<head>
    <title>App Error</title>
    <style>
        body { font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; background: #f8fafc; color: #1e293b; text-align: center; }
        .card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h1 { color: #ef4444; }
        p { margin-bottom: 2rem; }
        .btn { background: #4f46e5; color: white; padding: 0.75rem 1.5rem; border-radius: 8px; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Application Not Found</h1>
        <p>The built application files were not found in the <strong>dist/</strong> directory.<br>Please run <code>npm run build</code> before launching the app.</p>
        <a href="#" class="btn" onclick="window.location.reload()">Retry</a>
    </div>
</body>
</html>
